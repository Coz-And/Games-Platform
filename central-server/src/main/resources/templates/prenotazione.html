<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Prenota un Gioco — Connected Games</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        nav { background: #1a1a2e; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; text-decoration: none; margin-left: 1.5rem; }
        nav a:hover { color: #e94560; }
        .container { max-width: 600px; margin: 3rem auto; padding: 0 1rem; }
        .card { background: white; border-radius: 12px; padding: 2rem; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        h1 { color: #1a1a2e; margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.3rem; font-weight: bold; font-size: 0.9rem; color: #333; }
        select, input { width: 100%; padding: 0.7rem; margin-bottom: 1.2rem; border: 1px solid #ddd; border-radius: 6px; font-size: 0.95rem; }
        select:focus, input:focus { outline: none; border-color: #e94560; }
        .btn { width: 100%; background: #e94560; color: white; border: none; padding: 0.85rem; border-radius: 6px; font-size: 1rem; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #c73652; }
        .info-box { background: #e8f4fd; border-left: 4px solid #1a6eb0; padding: 0.8rem 1rem; border-radius: 4px; margin-bottom: 1.5rem; font-size: 0.9rem; color: #1a6eb0; }
    </style>
</head>
<body>
<nav>
    <span style="font-weight:bold;">🎮 Connected Games</span>
    <div>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/giochi}">Giochi</a>
        <a th:href="@{/tornei}">Tornei</a>
        <a th:href="@{/logout}" style="color:#e94560;">Esci</a>
    </div>
</nav>

<div class="container">
    <h1>📅 Prenota un Gioco</h1>

    <div class="card">
        <div class="info-box">
            ℹ️ Seleziona il locale e il gioco che vuoi prenotare.
        </div>

        <form th:action="@{/prenotazione}" method="post">
            <label>Locale</label>
            <select name="localeId" required>
                <option value="">-- Seleziona un locale --</option>
                <option th:each="l : ${locali}"
                        th:value="${l.id}"
                        th:text="${l.nome} + ' — ' + ${l.indirizzo}">
                    Locale
                </option>
            </select>

            <label>Gioco</label>
            <select name="giocoId" required>
                <option value="">-- Seleziona un gioco --</option>
                <option th:each="g : ${giochi}"
                        th:value="${g.id}"
                        th:text="${g.nome} + ' (' + ${g.tipo} + ')'">
                    Gioco
                </option>
            </select>

            <label>Data e Ora</label>
            <input type="datetime-local" name="dataOra" required/>

            <button class="btn" type="submit">📅 Prenota</button>
        </form>
    </div>
</div>
</body>
</html>
