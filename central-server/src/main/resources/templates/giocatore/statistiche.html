<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Statistiche</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; }
        nav { background: #1a1a2e; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; }
        nav a { color: white; text-decoration: none; margin-left: 1.5rem; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        h1 { color: #1a1a2e; margin-bottom: 1.5rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-box { background: #1a1a2e; color: white; border-radius: 8px; padding: 1.5rem; text-align: center; }
        .stat-box .numero { font-size: 2.5rem; font-weight: bold; color: #e94560; }
        .stat-box .label { font-size: 0.9rem; color: #aaa; margin-top: 0.3rem; }
    </style>
</head>
<body>
<nav>
    <span style="font-weight:bold;">🎮 Connected Games</span>
    <div>
        <a th:href="@{/dashboard}">Home</a>
        <a th:href="@{/giochi}">Giochi</a>
        <a th:href="@{/partite}">Partite</a>
        <a th:href="@{/tornei}">Tornei</a>
        <a th:href="@{/statistiche}">Statistiche</a>
        <a th:href="@{/logout}" style="color:#e94560;">Esci</a>
    </div>
</nav>
<div class="container">
    <h1>📊 Statistiche Piattaforma</h1>
    <div class="grid">
        <div class="stat-box">
            <div class="numero" th:text="${#lists.size(partite)}">0</div>
            <div class="label">Partite Totali</div>
        </div>
        <div class="stat-box">
            <div class="numero" th:text="${#lists.size(giochi)}">0</div>
            <div class="label">Giochi Registrati</div>
        </div>
    </div>
    <div class="card">
        <h2>Ultime Partite</h2>
        <p th:if="${#lists.isEmpty(partite)}" style="color:#888;">Nessuna partita registrata.</p>
        <ul th:unless="${#lists.isEmpty(partite)}">
            <li th:each="p : ${partite}"
                th:text="${p.gioco != null ? p.gioco.nome : 'N/A'} + ' — ' + ${p.stato} + ' — ' + ${p.iniziata}">
            </li>
        </ul>
    </div>
</div>
</body>
</html>
