<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Partite</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; }
        nav { background: #1a1a2e; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; }
        nav a { color: white; text-decoration: none; margin-left: 1.5rem; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        h1 { color: #1a1a2e; margin-bottom: 1.5rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f0f0f0; }
        .in-corso { background: #d4edda; color: #155724; padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.8rem; }
        .terminata { background: #f8d7da; color: #721c24; padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.8rem; }
    </style>
</head>
<body>
<nav>
    <span style="font-weight:bold;">🎮 Connected Games</span>
    <div>
        <a th:href="@{/giochi}">Giochi</a>
        <a th:href="@{/partite}">Partite</a>
        <a th:href="@{/tornei}">Tornei</a>
        <a th:href="@{/statistiche}">Statistiche</a>
        <a th:href="@{/logout}" style="color:#e94560;">Esci</a>
    </div>
</nav>
<div class="container">
    <h1>🏁 Partite</h1>
    <div class="card">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Gioco</th>
                <th>Tipo</th>
                <th>Stato</th>
                <th>Inizio</th>
                <th>Fine</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(partite)}">
                <td colspan="6" style="text-align:center; color:#888;">Nessuna partita registrata</td>
            </tr>
            <tr th:each="partita : ${partite}">
                <td th:text="${partita.id}">1</td>
                <td th:text="${partita.gioco != null ? partita.gioco.nome : 'N/A'}">Gioco</td>
                <td th:text="${partita.tipo}">TIPO</td>
                <td>
                        <span th:class="${partita.stato == T(com.connectedgames.model.Partita.StatoPartita).IN_CORSO ? 'in-corso' : 'terminata'}"
                              th:text="${partita.stato}">STATO</span>
                </td>
                <td th:text="${partita.iniziata}">00:00</td>
                <td th:text="${partita.terminata != null ? partita.terminata : '-'}">-</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
