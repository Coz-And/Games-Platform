<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Giochi Disponibili</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; }
        nav { background: #1a1a2e; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; }
        nav a { color: white; text-decoration: none; margin-left: 1.5rem; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        h1 { color: #1a1a2e; margin-bottom: 1.5rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f0f0f0; }
        .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.8rem; background: #cce5ff; color: #004085; }
    </style>
</head>
<body>
<nav>
    <span style="font-weight:bold;">🎮 Connected Games</span>
    <div>
        <a th:href="@{/giochi}">Giochi</a>
        <a th:href="@{/partite}">Partite</a>
        <a th:href="@{/tornei}">Tornei</a>
        <a th:href="@{/statistiche}">Statistiche</a>
    </div>
</nav>
<div class="container">
    <h1>🎮 Giochi Disponibili</h1>
    <div class="card">
        <table>
            <thead>
            <tr>
                <th>Nome</th>
                <th>Tipo</th>
                <th>Identificatore</th>
                <th>Locale</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(giochi)}">
                <td colspan="4" style="text-align:center; color:#888;">Nessun gioco disponibile</td>
            </tr>
            <tr th:each="gioco : ${giochi}">
                <td th:text="${gioco.nome}">Nome Gioco</td>
                <td><span class="badge" th:text="${gioco.tipo}">TIPO</span></td>
                <td th:text="${gioco.identificatore}">ID</td>
                <td th:text="${gioco.locale != null ? gioco.locale.nome : 'N/A'}">Locale</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
