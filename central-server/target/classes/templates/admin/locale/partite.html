<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Gestione Partite — Admin Locale</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        nav { background: #16213e; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; text-decoration: none; margin-left: 1.5rem; }
        nav a:hover { color: #e94560; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        h1 { color: #1a1a2e; margin-bottom: 1.5rem; }
        .card { background: white; border-radius: 8px; padding: 1.5rem; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        th { background: #f8f8f8; }
        .badge-verde { background: #d4edda; color: #155724; padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.8rem; }
        .badge-rosso { background: #f8d7da; color: #721c24; padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.8rem; }
        .badge-grigio { background: #e2e3e5; color: #383d41; padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.8rem; }
        .btn { display: inline-block; background: #e94560; color: white; padding: 0.5rem 1rem; border-radius: 6px; text-decoration: none; font-size: 0.85rem; border: none; cursor: pointer; }
        .btn-verde { background: #28a745; }
        .msg-success { background: #d4edda; color: #155724; padding: 0.7rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
    </style>
</head>
<body>
<nav>
    <span style="font-weight:bold;">🎮 Connected Games — Admin Locale</span>
    <div>
        <a th:href="@{/admin/locale}">Dashboard</a>
        <a th:href="@{/admin/locale/partite}">Partite</a>
        <a th:href="@{/admin/locale/utenti}">Utenti</a>
        <a th:href="@{/logout}" style="color:#e94560;">Esci</a>
    </div>
</nav>

<div class="container">
    <h1>🏁 Gestione Partite</h1>

    <div class="msg-success" th:if="${success}" th:text="${success}"></div>

    <div class="card">
        <div class="top-bar">
            <span style="font-weight:bold; color:#1a1a2e;">
                Totale: <span th:text="${#lists.size(partite)}">0</span> partite
            </span>
            <a th:href="@{/admin/locale/partite/nuova}" class="btn">➕ Nuova Partita</a>
        </div>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Gioco</th>
                <th>Tipo</th>
                <th>Stato</th>
                <th>Inizio</th>
                <th>Fine</th>
                <th>Azione</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(partite)}">
                <td colspan="7" style="color:#888; text-align:center; padding:2rem;">
                    Nessuna partita registrata.
                    <a th:href="@{/admin/locale/partite/nuova}" style="color:#e94560;">Crea la prima!</a>
                </td>
            </tr>
            <tr th:each="p : ${partite}">
                <td th:text="${p.id}">1</td>
                <td th:text="${p.gioco != null ? p.gioco.nome : 'N/A'}">Gioco</td>
                <td th:text="${p.tipo}">TIPO</td>
                <td>
                        <span th:class="${p.stato.name() == 'IN_CORSO' ? 'badge-verde' :
                                         p.stato.name() == 'TERMINATA' ? 'badge-rosso' : 'badge-grigio'}"
                              th:text="${p.stato}">STATO</span>
                </td>
                <td th:text="${p.iniziata}">-</td>
                <td th:text="${p.terminata != null ? p.terminata : '-'}">-</td>
                <td>
                    <form th:if="${p.stato.name() == 'IN_CORSO'}"
                          th:action="@{/admin/locale/partite/{id}/termina(id=${p.id})}"
                          method="post" style="display:inline;">
                        <button class="btn" type="submit">⏹ Termina</button>
                    </form>
                    <span th:unless="${p.stato.name() == 'IN_CORSO'}"
                          style="color:#888; font-size:0.85rem;">Conclusa</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
