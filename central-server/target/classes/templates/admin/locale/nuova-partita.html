<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Nuova Partita — Admin Locale</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        nav { background: #16213e; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; text-decoration: none; margin-left: 1.5rem; }
        nav a:hover { color: #e94560; }
        .container { max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        h1 { color: #1a1a2e; margin-bottom: 1.5rem; }
        .card { background: white; border-radius: 12px; padding: 2rem; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        label { display: block; margin-bottom: 0.3rem; font-weight: bold; font-size: 0.9rem; color: #333; }
        select, input { width: 100%; padding: 0.7rem; margin-bottom: 1.2rem; border: 1px solid #ddd; border-radius: 6px; font-size: 0.95rem; }
        select:focus { outline: none; border-color: #e94560; }
        .btn { width: 100%; background: #e94560; color: white; border: none; padding: 0.85rem; border-radius: 6px; font-size: 1rem; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #c73652; }
        .btn-secondary { background: #6c757d; margin-top: 0.5rem; }
        .msg-errore { background: #f8d7da; color: #721c24; padding: 0.7rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
        .info-box { background: #e8f4fd; border-left: 4px solid #1a6eb0; padding: 0.8rem 1rem; border-radius: 4px; margin-bottom: 1.2rem; font-size: 0.9rem; color: #1a6eb0; }
    </style>
</head>
<body>
<nav>
    <span style="font-weight:bold;">🎮 Connected Games — Admin Locale</span>
    <div>
        <a th:href="@{/admin/locale}">Dashboard</a>
        <a th:href="@{/admin/locale/partite}">Partite</a>
        <a th:href="@{/admin/locale/utenti}">Utenti</a>
        <a th:href="@{/logout}" style="color:#e94560;">Esci</a>
    </div>
</nav>

<div class="container">
    <h1>➕ Nuova Partita</h1>

    <div class="msg-errore" th:if="${errore}" th:text="${errore}"></div>

    <div class="card">
        <div class="info-box">
            ℹ️ La partita inizierà immediatamente dopo la creazione.
            Potrai terminarla dalla sezione Gestione Partite.
        </div>

        <form th:action="@{/admin/locale/partite/nuova}" method="post">

            <label>Gioco</label>
            <select name="giocoId" required>
                <option value="">-- Seleziona un gioco --</option>
                <option th:each="g : ${giochi}"
                        th:value="${g.id}"
                        th:text="${g.nome} + ' (' + ${g.tipo} + ')'">
                    Gioco
                </option>
            </select>

            <label>Tipo Partita</label>
            <select name="tipo" required>
                <option value="INDIVIDUALE">👤 Individuale</option>
                <option value="A_SQUADRE">👥 A Squadre</option>
            </select>

            <label>Giocatori (opzionale)</label>
            <select name="giocatoriIds" multiple
                    style="height:120px; margin-bottom:0.5rem;">
                <option th:each="u : ${utenti}"
                        th:value="${u.id}"
                        th:text="${u.nome} + ' ' + ${u.cognome} + ' (@' + ${u.username} + ')'">
                    Utente
                </option>
            </select>
            <p style="font-size:0.8rem; color:#888; margin-bottom:1.2rem;">
                Tieni premuto Cmd (Mac) o Ctrl (Windows) per selezionare più giocatori
            </p>

            <button class="btn" type="submit">🚀 Avvia Partita</button>
            <a th:href="@{/admin/locale/partite}"
               style="display:block; text-align:center; margin-top:1rem; color:#888; font-size:0.9rem;">
                Annulla
            </a>
        </form>
    </div>
</div>
</body>
</html>
