<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}">
<body>
<div th:fragment="content">
    <div class="page-title">🏪 <span th:text="${locale.nome}">Bar Belvedere</span></div>

    <div class="grid2">
        <div class="metric">
            <div class="metric-label">Partite oggi</div>
            <div class="metric-value" th:text="${stats.partiteOggi}">24</div>
        </div>
        <div class="metric">
            <div class="metric-label">Giochi attivi</div>
            <div class="metric-value" th:text="${stats.giochiAttivi}">4</div>
        </div>
        <div class="metric">
            <div class="metric-label">Utenti unici</div>
            <div class="metric-value" th:text="${stats.utentiUnici}">18</div>
            <div class="metric-sub">Questo mese</div>
        </div>
        <div class="metric">
            <div class="metric-label">Prenotazioni</div>
            <div class="metric-value" th:text="${stats.prenotazioniProssime}">7</div>
            <div class="metric-sub">Prossime 24h</div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="card-title" style="margin:0">Giochi del locale</div>
            <a href="/locale/giochi/nuovo" class="btn btn-primary">+ Aggiungi gioco</a>
        </div>
        <div th:each="g : ${giochi}" class="row">
            <div class="row-left">
                <div class="avatar">🎮</div>
                <div>
                    <div class="row-name" th:text="${g.nome + ' (' + g.identificatore + ')'}">Calciobalilla (CALC-001)</div>
                    <div class="row-sub" th:text="'Tipo: ' + ${g.tipo}">Tipo: CALCIOBALILLA</div>
                </div>
            </div>
            <div style="display:flex; gap:8px; align-items:center;">
                <span class="badge badge-green">Online</span>
                <a th:href="@{/locale/giochi/{id}(id=${g.id})}" class="btn">Gestisci</a>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">Prenotazioni in arrivo</div>
        <table class="table">
            <thead>
            <tr><th>Orario</th><th>Gioco</th><th>Giocatore</th><th>Stato</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="p : ${prenotazioni}">
                <td th:text="${p.orario}">14:00</td>
                <td th:text="${p.gioco.nome}">Calciobalilla</td>
                <td th:text="${p.utente.nome + ' ' + p.utente.cognome}">Mario Rossi</td>
                <td><span class="badge badge-blue">Confermata</span></td>
                <td>
                    <form th:action="@{/locale/prenotazioni/cancella/{id}(id=${p.id})}" method="post">
                        <button type="submit" class="btn btn-danger">Cancella</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
